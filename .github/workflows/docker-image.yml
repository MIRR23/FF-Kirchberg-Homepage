# Baut bei jedem Merge auf main automatisch das Docker-Image der Homepage
# und veröffentlicht es in der GitHub Container Registry (ghcr.io).
#
# Das Image heißt: ghcr.io/mirr23/ff-kirchberg-homepage:latest
# (zusätzlich gibt es je Commit ein Tag "sha-<kurzhash>" zum Zurückrollen)
#
# WICHTIG (einmalig): Nach dem ersten Lauf das Paket öffentlich stellen,
# damit der Hosting-Server es ohne Anmeldung ziehen kann:
# GitHub -> Profil -> Packages -> ff-kirchberg-homepage -> Package settings
# -> Danger Zone -> Change visibility -> Public
name: Docker-Image bauen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei ghcr.io anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Tags bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action wandelt den Repo-Namen automatisch in Kleinbuchstaben um
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
